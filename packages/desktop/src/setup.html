<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Banyan</title>
    <style>
      :root {
        --bg: #f5f3ee;
        --panel: #fffdf8;
        --text: #2b2a27;
        --muted: #6f6b63;
        --border: #e2ddd2;
        --accent: #b8603c;
        --error: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1e1c;
          --panel: #2a2926;
          --text: #ece9e2;
          --muted: #a29d93;
          --border: #3b3934;
          --accent: #d98a64;
          --error: #f2b8b5;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      form {
        width: min(420px, calc(100vw - 32px));
        display: grid;
        gap: 14px;
        padding: 28px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 500;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      input {
        padding: 9px 11px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      button {
        padding: 9px 11px;
        font: inherit;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      .error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>Banyan</h1>
      <p>填写 room server 地址 · Enter the room server address</p>
      <input id="url" required autofocus placeholder="http://banyan-host:7700" />
      <span id="error" class="error" role="alert"></span>
      <button>连接 · Connect</button>
    </form>
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const error = document.getElementById("error");
        error.textContent = "";
        try {
          await window.banyanDesktop.setServerUrl(document.getElementById("url").value);
        } catch (err) {
          error.textContent = String(err.message).replace(/^Error invoking remote method '[^']+': (Error: )?/, "");
        }
      });
    </script>
  </body>
</html>
